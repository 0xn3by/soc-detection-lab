  <rect x="0.5" y="0.5" width="169" height="29" rx="5.5" fill="none" stroke="#405367" />
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="37.5" y="19" fill="#e2e8f0">Python</text>
    <text x="122.5" y="19" fill="#b7ddf9" font-weight="700">stdlib only</text>
  </g>
