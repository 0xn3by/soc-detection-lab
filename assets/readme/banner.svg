    <text x="48" y="125" fill="#f1f5f9" font-size="54" font-weight="700">SOC Detection</text>
    <text x="48" y="181" fill="#f1f5f9" font-size="38" font-weight="700">&amp; Incident Investigation Lab</text>
    <text x="50" y="220" fill="#b9cbd7" font-size="18">Practice the investigation. Explain the evidence.</text>
    <text x="50" y="248" fill="#9bb4c6" font-size="14">Synthetic telemetry  /  Four scenarios  /  Defensible analyst decisions</text>
  </g>
