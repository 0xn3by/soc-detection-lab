<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">SOC Detection &amp; Incident Investigation Lab</title>
  <desc id="description">Personal security lab. Synthetic logs move through detection, evidence correlation, and incident reporting. Navy background with teal evidence nodes and an outlined investigation lens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e" />
      <stop offset="1" stop-color="#122a36" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#254454" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#background)" />
  <rect x="800" y="20" width="372" height="250" rx="16" fill="url(#grid)" opacity="0.45" />
